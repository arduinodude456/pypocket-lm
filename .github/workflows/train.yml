name: Train and publish PyPocket LM

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'tiny_python_lm.py'
      - 'train.py'
      - 'web/**'
      - '.github/workflows/train.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  train-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Train JSON model
        run: python train.py --epochs 2
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Publish static demo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./web
          force_orphan: true
